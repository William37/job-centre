<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Centre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1116">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Job Centre</title>
<style>
html,body{margin:0;height:100%;background:#0e1116;color:#e9ecf2;font:16px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
img{width:72px;height:72px;border-radius:18px;margin-bottom:16px}
p{color:#9aa2b3;max-width:340px;margin:6px 0}
.sp{width:26px;height:26px;border:3px solid #272d39;border-top-color:#3ec9a7;border-radius:50%;animation:r 0.8s linear infinite;margin-top:14px}
@keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body><div class="w"><img src="icon.png" alt=""><b>Job Centre</b><p id="msg">Opening your jobs...</p><div class="sp" id="sp"></div></div>
<script>
(function () {
  function say(t) { document.getElementById('msg').textContent = t; var s = document.getElementById('sp'); if (s) s.style.display = 'none'; }
  function b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function te(s) { return new TextEncoder().encode(s); }
  var m = location.hash.match(/k=([A-Za-z0-9_-]{20,})/), k = m ? m[1] : null;
  try { if (k) localStorage.setItem('jc.phoneKey', k); else k = localStorage.getItem('jc.phoneKey'); } catch (e) {}
  if (!k) { say('This page needs the private link from your PC. On the PC, open Job Centre, click the phone button and scan the QR code.'); return; }
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { say('Please update iOS (16.4 or later) to open Job Centre.'); return; }
  var subtle = crypto.subtle;
  function get(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function newest() {
    var t = Date.now();
    var a = get('data.json?t=' + t).catch(function () { return null; });
    var b = get('https://raw.githubusercontent.com/William37/job-centre/main/data.json?t=' + t).catch(function () { return null; });
    return Promise.all([a, b]).then(function (r) {
      var best = null; r.forEach(function (d) { if (d && d.ct && (!best || (d.t || '') > (best.t || ''))) best = d; });
      if (best) { try { localStorage.setItem('jc.phoneCache', JSON.stringify(best)); } catch (e) {} return best; }
      var c = null; try { c = JSON.parse(localStorage.getItem('jc.phoneCache') || 'null'); } catch (e) {}
      if (c) return c;
      throw new Error('offline');
    });
  }
  var raw = b64(k);
  subtle.importKey('raw', raw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']).then(function (base) {
    return Promise.all([subtle.sign('HMAC', base, te('enc')), subtle.sign('HMAC', base, te('mac')), newest()]);
  }).then(function (x) {
    var d = x[2], iv = b64(d.iv), ct = b64(d.ct), mac = b64(d.mac);
    var both = new Uint8Array(iv.length + ct.length); both.set(iv, 0); both.set(ct, iv.length);
    return subtle.importKey('raw', x[1], { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']).then(function (mk) {
      return subtle.verify('HMAC', mk, mac, both);
    }).then(function (ok) {
      if (!ok) throw new Error('key');
      return subtle.importKey('raw', x[0], { name: 'AES-CBC' }, false, ['decrypt']);
    }).then(function (ek) { return subtle.decrypt({ name: 'AES-CBC', iv: iv }, ek, ct); });
  }).then(function (gz) {
    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }).then(function (html) {
    document.open(); document.write(html); document.close();
  }).catch(function (e) {
    if (e && e.message === 'key') say('This link does not match your Job Centre any more. On the PC, click the phone button in Job Centre and scan the new QR code.');
    else if (e && e.message === 'offline') say('Could not load your jobs. Check the internet connection and open Job Centre again.');
    else say('Could not open your jobs (' + (e && e.message || e) + '). Try again in a minute.');
  });
})();
</script>
</body></html>
